name: All phase labs

on:
  push:
    paths:
      - "curriculum/README.md"
      - "curriculum/phase-*/**"
      - "curriculum/labs/**"
      - ".github/workflows/all-phase-labs.yml"
  pull_request:
    paths:
      - "curriculum/README.md"
      - "curriculum/phase-*/**"
      - "curriculum/labs/**"
      - ".github/workflows/all-phase-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-phase-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curriculum/labs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install locked shared lab dependencies
        run: uv sync --locked --extra test
      - name: Run cross-phase lab tests
        run: uv run --locked pytest tests
