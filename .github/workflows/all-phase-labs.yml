name: All phase labs

on:
  push:
    paths:
      - "curriculum/README.md"
      - "curriculum/phase-*/**"
      - "curriculum/labs/**"
      - ".github/workflows/all-phase-labs.yml"
  pull_request:
    paths:
      - "curriculum/README.md"
      - "curriculum/phase-*/**"
      - "curriculum/labs/**"
      - ".github/workflows/all-phase-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-phase-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curriculum/labs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Phase 2 service and tests
        run: python -m pip install -e "../phase-2-production-ai/starter[test]"
      - name: Install shared lab test tools
        run: python -m pip install -e ".[test]"
      - name: Run every phase lab suite
        run: python -m pytest tests ../phase-2-production-ai/starter/tests
