name: Phase 2 reference starter

on:
  push:
    paths:
      - "curriculum/phase-2-production-ai/starter/**"
      - ".github/workflows/phase-2-reference.yml"
  pull_request:
    paths:
      - "curriculum/phase-2-production-ai/starter/**"
      - ".github/workflows/phase-2-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curriculum/phase-2-production-ai/starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install starter and assessment dependencies
        run: python -m pip install -e ".[test]"
      - name: Run starter assessments
        run: python -m pytest
