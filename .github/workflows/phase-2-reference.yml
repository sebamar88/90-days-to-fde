name: Phase 2 reference starter

on:
  push:
    paths:
      - "curriculum/phase-2-production-ai/starter/**"
      - ".github/workflows/phase-2-reference.yml"
  pull_request:
    paths:
      - "curriculum/phase-2-production-ai/starter/**"
      - ".github/workflows/phase-2-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curriculum/phase-2-production-ai/starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install locked starter and assessment dependencies
        run: uv sync --locked --extra test
      - name: Run starter assessments
        run: uv run --locked pytest
