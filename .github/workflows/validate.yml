name: Validate curriculum

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate curriculum structure and links
        run: node scripts/validate-curriculum.mjs
