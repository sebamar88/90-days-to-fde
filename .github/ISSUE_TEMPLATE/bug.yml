name: Content or repository problem
description: Report a broken link, unclear instruction, or validation defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: issue
    attributes:
      label: What is wrong?
      description: Include the file/day and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps or context to reproduce
    validations:
      required: true
