name: Curriculum improvement
description: Suggest a lesson, exercise, assessment, or roadmap improvement
title: "[Curriculum]: "
labels: [curriculum]
body:
  - type: input
    id: location
    attributes:
      label: Lesson or phase
      placeholder: Day number or phase
    validations:
      required: true
  - type: textarea
    id: learner_problem
    attributes:
      label: Learner problem
      description: What is unclear, missing, inaccurate, or difficult to assess?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and sources
      description: Include authoritative links; note whether claims are observed or inferred.
    validations:
      required: false
